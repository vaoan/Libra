[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
user=nextjs

[program:nginx]
command=/bin/sh -c 'until nc -z 127.0.0.1 5000 && nc -z 127.0.0.1 5001 && nc -z 127.0.0.1 5002 && nc -z 127.0.0.1 5004 && nc -z 127.0.0.1 5005 && nc -z 127.0.0.1 5006; do sleep 1; done && exec /usr/sbin/nginx -g "daemon off;"'
user=nextjs
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:store]
command=node /app/store/apps/store/server.js
directory=/app/store
user=nextjs
autostart=true
autorestart=true
startretries=5
startsecs=5
stopwaitsecs=30
environment=PORT="5001",HOSTNAME="0.0.0.0"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:studio]
command=node /app/studio/apps/studio/server.js
directory=/app/studio
user=nextjs
autostart=true
autorestart=true
startretries=5
startsecs=5
stopwaitsecs=30
environment=PORT="5006",HOSTNAME="0.0.0.0"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:landing]
command=node /app/landing/apps/landing/server.js
directory=/app/landing
user=nextjs
autostart=true
autorestart=true
startretries=5
startsecs=5
stopwaitsecs=30
environment=PORT="5004",HOSTNAME="0.0.0.0"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:payments]
command=node /app/payments/apps/payments/server.js
directory=/app/payments
user=nextjs
autostart=true
autorestart=true
startretries=5
startsecs=5
stopwaitsecs=30
environment=PORT="5005",HOSTNAME="0.0.0.0"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:admin]
command=node /app/admin/apps/admin/server.js
directory=/app/admin
user=nextjs
autostart=true
autorestart=true
startretries=5
startsecs=5
stopwaitsecs=30
environment=PORT="5002",HOSTNAME="0.0.0.0"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:auth]
command=node /app/auth/apps/auth/server.js
directory=/app/auth
user=nextjs
autostart=true
autorestart=true
startretries=5
startsecs=5
stopwaitsecs=30
environment=PORT="5000",HOSTNAME="0.0.0.0",AUTH_COOKIES_SECURE="true"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:warmer]
command=/bin/sh /app/warmer.sh
directory=/app
user=nextjs
autostart=true
autorestart=true
startretries=5
startsecs=0
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:boot-reporter]
command=node /app/boot-reporter.mjs
directory=/app
user=nextjs
autostart=true
autorestart=false
startretries=0
startsecs=0
exitcodes=0,1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
