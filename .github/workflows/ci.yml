name: CI

on:
  pull_request:
    branches: [main, develop]
  # Also run on the merged result. Without this, CI only ever saw the PR head:
  # two PRs that each passed alone could break develop together, and nobody
  # would find out until the next pull request opened.
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # ============================================
  # Detect Changes (skip CI for docs-only PRs)
  # ============================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      store: ${{ steps.filter.outputs.store }}
      studio: ${{ steps.filter.outputs.studio }}
      admin: ${{ steps.filter.outputs.admin }}
      landing: ${{ steps.filter.outputs.landing }}
      payments: ${{ steps.filter.outputs.payments }}
      auth: ${{ steps.filter.outputs.auth }}
      packages: ${{ steps.filter.outputs.packages }}
      tooling: ${{ steps.filter.outputs.tooling }}
      docs-only: ${{ steps.check.outputs.docs-only }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Detect file changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            store:
              - 'apps/store/**'
            studio:
              - 'apps/studio/**'
            admin:
              - 'apps/admin/**'
            auth:
              - 'apps/auth/**'
            landing:
              - 'apps/landing/**'
            payments:
              - 'apps/payments/**'
            packages:
              - 'packages/**'
            tooling:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'eslint.config.*'
              - 'prettier.config.*'
              - 'turbo.json'
              - '.madgerc'
              - '.ls-lint.yml'
              - 'cspell.json'
              - 'knip.json'
              - 'stylelint.config.*'
              - 'vitest.config.*'
              # Each of these changes how the code is built, checked or resolved,
              # and each was previously treated as docs-only. This PR is the
              # proof: it edits .jscpd.json, and CI skipped the quality,
              # unit-test, build and E2E jobs entirely.
              - '.jscpd.json'
              - '.secretlintrc.*'
              - '.secretlintignore'
              - '.syncpackrc.*'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.nvmrc'
              - 'orval.config.*'
              - '.prettierrc*'
              - '.prettierignore'
              - '.gitattributes'
              - '.env.ci'
              - '.husky/**'
              - 'config/**'
            code:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'eslint.config.*'
              - 'prettier.config.*'
              - 'turbo.json'
              - '.madgerc'
              - '.ls-lint.yml'
              - 'cspell.json'
              - 'knip.json'
              - 'stylelint.config.*'
              - 'vitest.config.*'
              # Each of these changes how the code is built, checked or resolved,
              # and each was previously treated as docs-only. This PR is the
              # proof: it edits .jscpd.json, and CI skipped the quality,
              # unit-test, build and E2E jobs entirely.
              - '.jscpd.json'
              - '.secretlintrc.*'
              - '.secretlintignore'
              - '.syncpackrc.*'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - '.nvmrc'
              - 'orval.config.*'
              - '.prettierrc*'
              - '.prettierignore'
              - '.gitattributes'
              - '.env.ci'
              - '.husky/**'
              - 'config/**'
              # CI could not previously validate changes to itself: a workflow
              # edit counted as docs-only, so every quality/test/build job
              # skipped. Same for schema and container changes.
              - '.github/workflows/**'
              - 'supabase/**'
              - 'docker/**'
              - 'scripts/**'
      - name: Check if docs-only
        id: check
        run: |
          if [ "${{ steps.filter.outputs.code }}" = "false" ]; then
            echo "docs-only=true" >> $GITHUB_OUTPUT
            echo "Docs-only PR detected - skipping full CI"
          else
            echo "docs-only=false" >> $GITHUB_OUTPUT
            echo "Code changes detected - running full CI"
          fi

  # ============================================
  # Quality Checks (skip for docs-only PRs)
  # ============================================
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history: the migration-edit check diffs against the
          # base branch, which a shallow clone does not contain.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check app registry
        run: bash scripts/check-app-registry.sh

      - name: Check formatting
        run: pnpm run format:check

      # The migration set is squashed, so "change the function" looks like an
      # edit to the file that already defines it. Supabase never re-runs an
      # applied migration, so such an edit reaches the file and no database.
      # Needs the base branch present, hence fetch-depth: 0 is required on the
      # checkout above for this job.
      - name: Check no applied migration was edited
        # Skipped on a release PR. These three compare the head against the
        # PR's base, which is the right question for a feature branch and the
        # wrong one for `develop` -> `main`: the base is the last release, so
        # the diff is every change since it, and each of those changes already
        # answered this check when it merged to develop. Asking again at
        # release time re-reports settled work -- the v2026.09.05.1 release PR
        # failed on the migration squash that #386 had already justified and
        # merged. Skipping is stated in the log; pointing the check at develop
        # instead would pass vacuously, since develop IS the head.
        if: github.base_ref != 'main'
        run: node scripts/check-migration-edits.mjs "origin/${{ github.base_ref || 'develop' }}"

      # These ran in no workflow — only in the husky precommit hook, which any
      # `--no-verify` commit bypasses.
      #
      # cspell was previously scoped to apps/*/src and packages/*/src, which is
      # how it passed: the issues it had were all outside that scope. It now
      # runs over the whole repo, as aeleos does.
      #
      # jscpd was reported as not passing at 9.36%. Most of that was not source
      # duplication: MSW's generated service worker (349 identical lines in
      # three apps), the test files this repo moved into tests/ directories,
      # and per-app next.config/vitest.config, which the frameworks require
      # each app to own. With those excluded — the same exclusions aeleos uses
      # — real source duplication is 3.95%, under the 5% threshold, so it is
      # enforced here too.
      #
      # knip is now enforced. It was previously excluded on the grounds that
      # its 205 findings were advisory noise, which was wrong: they were three
      # different things, and only one was fuzzy. Its config had `project`
      # scoped to src/**, so it never saw e2e/ or tests/ and reported anything
      # used only there as unused. With that fixed it found real defects --
      # @clerk/backend imported by three e2e files and declared in no
      # package.json, and packages/api declaring three export subpaths whose
      # targets do not exist. The remaining 201 were dead barrel re-exports,
      # dead destructured bindings, exports used only in their own file, and
      # eight genuinely dead declarations. All resolved; it now exits 0.
      - name: Repo hygiene (workspace + structure checks)
        run: |
          set -euo pipefail
          pnpm run sherif
          pnpm run syncpack:lint
          pnpm exec ls-lint
          pnpm exec cspell "**/*.{ts,tsx,md,json}" --no-progress
          pnpm exec jscpd .
          pnpm exec knip
          node scripts/check-source-bytes.mjs
          node scripts/check-feature-boundaries.mjs
          node scripts/check-a11y-patterns.mjs
          node scripts/check-doc-references.mjs
          node scripts/check-css-sync.mjs
          node scripts/check-env-parity.mjs
          pnpm exec madge --circular --extensions ts,tsx,js,jsx apps/store/src apps/studio/src apps/landing/src apps/payments/src apps/admin/src apps/auth/src packages/ui/src packages/shared/src packages/api/src packages/app-components/src packages/auth/src tests scripts docker

      # Ported from aeleos with one change: a symbol undocumented on both
      # sides is skipped. aeleos enforces jsdoc/require-jsdoc so every export
      # there has a doc; Libra documents about a third of them, and without
      # the skip this would fail on every undocumented export anyone edited --
      # a coverage mandate wearing a freshness check's name.
      #
      # Measured against the 37 source-touching commits before it existed, it
      # would have failed 10. That is the retroactive rate, not the steady-state
      # one: the way past it is to touch the doc, so under the gate authors do,
      # and the rate falls toward zero. Needs fetch-depth: 0, above.
      - name: Check documentation moved with the code
        # Skipped on a release PR. These three compare the head against the
        # PR's base, which is the right question for a feature branch and the
        # wrong one for `develop` -> `main`: the base is the last release, so
        # the diff is every change since it, and each of those changes already
        # answered this check when it merged to develop. Asking again at
        # release time re-reports settled work -- the v2026.09.05.1 release PR
        # failed on the migration squash that #386 had already justified and
        # merged. Skipping is stated in the log; pointing the check at develop
        # instead would pass vacuously, since develop IS the head.
        if: github.base_ref != 'main'
        run: node scripts/check-doc-freshness.mjs "origin/${{ github.base_ref || 'develop' }}"

      # The fourth gate in this series found running in no workflow and no hook.
      # It answers the one question a test-count cannot: did a rework drop a
      # case? Neither file counts nor totals catch that -- both can hold while
      # an assertion disappears. It compares the committed inventory at the
      # merge base against one regenerated from the working tree, and fails on
      # any case name present before and absent now. Needs fetch-depth: 0,
      # above, for the merge base to exist.
      #
      # If it fails, the fix is to restore the case. Regenerating
      # tests/INVENTORY.md makes the failure disappear without answering it,
      # which is how a real loss gets buried -- only regenerate after checking
      # each reported name against the live tree, and say what you checked.
      - name: Check no test case was dropped
        # Skipped on a release PR. These three compare the head against the
        # PR's base, which is the right question for a feature branch and the
        # wrong one for `develop` -> `main`: the base is the last release, so
        # the diff is every change since it, and each of those changes already
        # answered this check when it merged to develop. Asking again at
        # release time re-reports settled work -- the v2026.09.05.1 release PR
        # failed on the migration squash that #386 had already justified and
        # merged. Skipping is stated in the log; pointing the check at develop
        # instead would pass vacuously, since develop IS the head.
        if: github.base_ref != 'main'
        run: bash scripts/test-inventory-diff.sh "origin/${{ github.base_ref || 'develop' }}"

      - name: Lint (scoped)
        run: |
          set -euo pipefail

          SELECT_OUTPUT=$(bash scripts/select-workspaces.sh \
            "${{ needs.changes.outputs.store }}" \
            "${{ needs.changes.outputs.landing }}" \
            "${{ needs.changes.outputs.payments }}" \
            "${{ needs.changes.outputs.admin }}" \
            "${{ needs.changes.outputs.auth }}" \
            "${{ needs.changes.outputs.packages }}" \
            "${{ needs.changes.outputs.tooling }}" \
            "${{ needs.changes.outputs.studio }}")

          RUN_ALL=$(echo "$SELECT_OUTPUT" | grep '^RUN_ALL=' | cut -d= -f2-)
          LINT_TARGETS=$(echo "$SELECT_OUTPUT" | grep '^LINT_TARGETS=' | cut -d= -f2-)

          if [ "$RUN_ALL" = "true" ]; then
            echo "Running full lint because packages/tooling changed."
            pnpm run lint
            exit 0
          fi

          if [ -z "$LINT_TARGETS" ]; then
            echo "No lintable workspace changes detected. Skipping lint."
            exit 0
          fi

          echo "Running scoped lint for:$LINT_TARGETS"
          pnpm exec eslint $LINT_TARGETS

      - name: Type check (scoped)
        run: |
          set -euo pipefail

          SELECT_OUTPUT=$(bash scripts/select-workspaces.sh \
            "${{ needs.changes.outputs.store }}" \
            "${{ needs.changes.outputs.landing }}" \
            "${{ needs.changes.outputs.payments }}" \
            "${{ needs.changes.outputs.admin }}" \
            "${{ needs.changes.outputs.auth }}" \
            "${{ needs.changes.outputs.packages }}" \
            "${{ needs.changes.outputs.tooling }}" \
            "${{ needs.changes.outputs.studio }}")

          RUN_ALL=$(echo "$SELECT_OUTPUT" | grep '^RUN_ALL=' | cut -d= -f2-)
          APPS=$(echo "$SELECT_OUTPUT" | grep '^APPS=' | cut -d= -f2-)

          if [ "$RUN_ALL" = "true" ]; then
            echo "Running full typecheck because packages/tooling changed."
            pnpm run typecheck
            exit 0
          fi

          [ -z "$APPS" ] && echo "No workspace apps selected for typecheck." && exit 0
          for APP in $APPS; do
            pnpm --filter "$APP" typecheck
          done

      - name: Monorepo checks
        if: needs.changes.outputs.packages == 'true' || needs.changes.outputs.tooling == 'true'
        run: |
          pnpm run sherif
          pnpm run syncpack:lint

  # ============================================
  # Unit Tests (Vitest) - All Apps
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests (scoped)
        run: |
          set -euo pipefail

          SELECT_OUTPUT=$(bash scripts/select-workspaces.sh \
            "${{ needs.changes.outputs.store }}" \
            "${{ needs.changes.outputs.landing }}" \
            "${{ needs.changes.outputs.payments }}" \
            "${{ needs.changes.outputs.admin }}" \
            "${{ needs.changes.outputs.auth }}" \
            "${{ needs.changes.outputs.packages }}" \
            "${{ needs.changes.outputs.tooling }}" \
            "${{ needs.changes.outputs.studio }}")

          RUN_ALL=$(echo "$SELECT_OUTPUT" | grep '^RUN_ALL=' | cut -d= -f2-)
          APPS=$(echo "$SELECT_OUTPUT" | grep '^APPS=' | cut -d= -f2-)

          if [ "$RUN_ALL" = "true" ]; then
            echo "Running full coverage because packages/tooling changed."
            pnpm run test:coverage
            exit 0
          fi

          [ -z "$APPS" ] && echo "No workspace apps selected for unit tests." && exit 0
          for APP in $APPS; do
            pnpm --filter "$APP" test:coverage
          done

      - name: Upload store coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && (needs.changes.outputs.store == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.tooling == 'true')
        with:
          name: coverage-report-store
          path: apps/store/coverage/
          retention-days: 7

      - name: Upload admin coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && (needs.changes.outputs.admin == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.tooling == 'true')
        with:
          name: coverage-report-admin
          path: apps/admin/coverage/
          retention-days: 7

      - name: Upload auth coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && (needs.changes.outputs.auth == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.tooling == 'true')
        with:
          name: coverage-report-auth
          path: apps/auth/coverage/
          retention-days: 7

      - name: Upload landing coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && (needs.changes.outputs.landing == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.tooling == 'true')
        with:
          name: coverage-report-landing
          path: apps/landing/coverage/
          retention-days: 7

      - name: Upload payments coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && (needs.changes.outputs.payments == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.tooling == 'true')
        with:
          name: coverage-report-payments
          path: apps/payments/coverage/
          retention-days: 7

  # ============================================
  # Docker Build — single image for E2E
  # ============================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/ci/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.CI_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_AUTH_URL=http://localhost:5050/auth
            NEXT_PUBLIC_AUTH_HOST_URL=http://localhost:5050/auth
            NEXT_PUBLIC_STORE_URL=http://localhost:5050/store
            NEXT_PUBLIC_ADMIN_URL=http://localhost:5050/admin
            NEXT_PUBLIC_LANDING_URL=http://localhost:5050
            NEXT_PUBLIC_PAYMENTS_URL=http://localhost:5050/payments
            NEXT_PUBLIC_STUDIO_URL=http://localhost:5050/studio
            NEXT_PUBLIC_BUILD_HASH=ci
            NEXT_PUBLIC_ENABLE_TEST_IDS=true
            NEXT_PUBLIC_ENV_DEBUG=false
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CLERK_DOMAIN=${{ secrets.CLERK_DOMAIN }}

  # ============================================
  # E2E Tests (Playwright)
  # ============================================
  # ============================================
  # Database Invariants
  # ============================================
  db-tests:
    name: Database Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Applies every migration from scratch, so the suite asserts against the
      # schema the migrations produce rather than whatever a previous run left.
      - name: Start Supabase
        # The env loader validates every $secret: reference in .env.ci, not just
        # the ones this job reads, so the full set has to be present or it
        # refuses to load. Mirrors the e2e-tests block.
        env:
          CI_SUPABASE_ANON_KEY: ${{ secrets.CI_SUPABASE_ANON_KEY }}
          CI_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CI_SUPABASE_SERVICE_ROLE_KEY }}
          CI_SUPABASE_JWT_SECRET: ${{ secrets.CI_SUPABASE_JWT_SECRET }}
          CI_SUPABASE_DB_PASSWORD: ${{ secrets.CI_SUPABASE_DB_PASSWORD }}
          CLERK_DOMAIN: ${{ secrets.CLERK_DOMAIN }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          GOOGLE_TEST_EMAIL: ${{ secrets.GOOGLE_TEST_EMAIL }}
          GOOGLE_TEST_PASSWORD: ${{ secrets.GOOGLE_TEST_PASSWORD }}
          TALLY_FORM_ID: ${{ secrets.TALLY_FORM_ID }}
        run: pnpm supabase:docker start --env ci

      - name: Run database invariant tests
        # The env loader validates every $secret: reference in .env.ci, not just
        # the ones this job reads, so the full set has to be present or it
        # refuses to load. Mirrors the e2e-tests block.
        env:
          CI_SUPABASE_ANON_KEY: ${{ secrets.CI_SUPABASE_ANON_KEY }}
          CI_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CI_SUPABASE_SERVICE_ROLE_KEY }}
          CI_SUPABASE_JWT_SECRET: ${{ secrets.CI_SUPABASE_JWT_SECRET }}
          CI_SUPABASE_DB_PASSWORD: ${{ secrets.CI_SUPABASE_DB_PASSWORD }}
          CLERK_DOMAIN: ${{ secrets.CLERK_DOMAIN }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          GOOGLE_TEST_EMAIL: ${{ secrets.GOOGLE_TEST_EMAIL }}
          GOOGLE_TEST_PASSWORD: ${{ secrets.GOOGLE_TEST_PASSWORD }}
          TALLY_FORM_ID: ${{ secrets.TALLY_FORM_ID }}
        run: pnpm test:db --env ci

      - name: Stop Supabase
        if: always()
        run: pnpm supabase:docker stop --env ci || true

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [changes, docker-build]
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and tag pre-built app image
        run: |
          docker pull ${{ needs.docker-build.outputs.image }}
          docker tag ${{ needs.docker-build.outputs.image }} libra-ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm --filter auth-app list @playwright/test --json | jq -r '.[0].devDependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter auth-app exec playwright install --with-deps chromium

      - name: Install Playwright dependencies (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter auth-app exec playwright install-deps chromium

      - name: Run E2E tests (scoped)
        env:
          # Secret names match the $secret: references in .env.ci exactly.
          # load-env.mjs sees CI=true and resolves $secret:KEY → process.env[KEY].
          # Topology (APPS_MODE, SUPABASE_MODE, HOST_PORT, URLs) comes from .env.ci.
          CI_SUPABASE_ANON_KEY: ${{ secrets.CI_SUPABASE_ANON_KEY }}
          CI_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CI_SUPABASE_SERVICE_ROLE_KEY }}
          CI_SUPABASE_JWT_SECRET: ${{ secrets.CI_SUPABASE_JWT_SECRET }}
          CI_SUPABASE_DB_PASSWORD: ${{ secrets.CI_SUPABASE_DB_PASSWORD }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_DOMAIN: ${{ secrets.CLERK_DOMAIN }}
          TALLY_FORM_ID: ${{ secrets.TALLY_FORM_ID }}
          GOOGLE_TEST_EMAIL: ${{ secrets.GOOGLE_TEST_EMAIL }}
          GOOGLE_TEST_PASSWORD: ${{ secrets.GOOGLE_TEST_PASSWORD }}
        run: |
          set -euo pipefail

          SELECT_OUTPUT=$(bash scripts/select-workspaces.sh \
            "${{ needs.changes.outputs.store }}" \
            "${{ needs.changes.outputs.landing }}" \
            "${{ needs.changes.outputs.payments }}" \
            "${{ needs.changes.outputs.admin }}" \
            "${{ needs.changes.outputs.auth }}" \
            "${{ needs.changes.outputs.packages }}" \
            "${{ needs.changes.outputs.tooling }}" \
            "${{ needs.changes.outputs.studio }}")

          APPS=$(echo "$SELECT_OUTPUT" | grep '^APPS=' | cut -d= -f2-)
          [ -z "$APPS" ] && echo "No workspace apps selected for E2E tests." && exit 0

          for APP in $APPS; do
            # Map pnpm filter name → scripts/e2e.mjs --app value.
            # e2e.mjs starts Supabase + Docker container and runs Playwright,
            # all driven by the env vars loaded from .env.ci.
            case "$APP" in
              auth-app) E2E_APP="auth"  ;;
              store)    E2E_APP="store" ;;
              admin)    E2E_APP="admin" ;;
              payments) E2E_APP="payments" ;;
              # landing has had a playwright config and a spec all along, but no
              # entry here -- so its E2E suite had never run.
              landing)  E2E_APP="landing" ;;
              *)        echo "No E2E suite for ${APP}, skipping."; continue ;;
            esac
            echo "Running E2E for ${E2E_APP} (env=ci)"
            node scripts/e2e.mjs --env ci --app "${E2E_APP}"
          done

      - name: Capture app container logs (on failure)
        # A container-side crash (e.g. a crash-looping supervisord program)
        # shows up to Playwright only as a generic connection error, with
        # nothing in the CI step output explaining why. Dump the app
        # container's own logs so that reason is visible without a local
        # repro next time.
        if: failure()
        run: |
          set -uo pipefail
          docker ps -a > docker-ps.log 2>&1 || true
          docker logs libra-ci > libra-ci-container.log 2>&1 || echo "no libra-ci container found" > libra-ci-container.log

      - name: Upload app container logs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: libra-ci-container-logs
          path: |
            libra-ci-container.log
            docker-ps.log
          retention-days: 7

      - name: Upload store Playwright report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && (needs.changes.outputs.store == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.tooling == 'true')
        with:
          name: playwright-report-store
          path: apps/store/playwright-report/
          retention-days: 7

      - name: Upload admin Playwright report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && (needs.changes.outputs.admin == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.tooling == 'true')
        with:
          name: playwright-report-admin
          path: apps/admin/playwright-report/
          retention-days: 7

      - name: Upload auth Playwright report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && (needs.changes.outputs.auth == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.tooling == 'true')
        with:
          name: playwright-report-auth
          path: apps/auth/playwright-report/
          retention-days: 7

      - name: Upload landing Playwright report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && (needs.changes.outputs.landing == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.tooling == 'true')
        with:
          name: playwright-report-landing
          path: apps/landing/playwright-report/
          retention-days: 7

      - name: Upload payments Playwright report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always() && (needs.changes.outputs.payments == 'true' || needs.changes.outputs.packages == 'true' || needs.changes.outputs.tooling == 'true')
        with:
          name: playwright-report-payments
          path: apps/payments/playwright-report/
          retention-days: 7

      - name: Sweep leaked Clerk test users (fail-safe)
        # This is NOT the cleanup mechanism -- createTestUser registers users
        # and a worker-scoped Playwright fixture drains them on every normal
        # run. This step exists only for what that in-process teardown cannot
        # cover: a killed runner, an OOM, a hard cancellation. `if: always()`
        # so it still runs when the job above failed or was cancelled. In
        # normal operation it must find nothing to delete.
        #
        # The sweeper only reads CLERK_SECRET_KEY, but it loads via
        # scripts/load-env.mjs (TARGET_ENV defaults to "dev"), which resolves
        # every $secret: reference in .env.dev under CI=true -- not just the
        # one this step cares about -- so all of .env.dev's Clerk/Tally/Google
        # secrets must be present here or load-env.mjs fails loudly on the
        # first one that isn't (see .env.dev and load-env.mjs's CI branch).
        #
        # continue-on-error: a fail-safe must never be able to fail the
        # build. The listing loop inside the script already logs and exits 0
        # on its own failure; this is the second, independent layer in case
        # something else in the step (network setup, node itself) fails
        # first.
        #
        # --older-than-hours 2 is a deliberate anti-race window, not a bug:
        # without it, this step could delete a user another concurrent PR run
        # just created and hasn't drained yet. The tradeoff is that a leak
        # from the job this step follows is never itself a candidate --
        # `to delete (e2e): 0` here means "nothing old enough", not "nothing
        # leaked". A genuine leak from this run only becomes visible (and
        # gets swept) on the next run that's at least 2 hours later, so the
        # invariant this step polices holds one run late, never immediately.
        if: always()
        continue-on-error: true
        run: node scripts/clerk-sweep-e2e-users.mjs --older-than-hours 2
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_DOMAIN: ${{ secrets.CLERK_DOMAIN }}
          TALLY_FORM_ID: ${{ secrets.TALLY_FORM_ID }}
          GOOGLE_TEST_EMAIL: ${{ secrets.GOOGLE_TEST_EMAIL }}
          GOOGLE_TEST_PASSWORD: ${{ secrets.GOOGLE_TEST_PASSWORD }}

  # ============================================
  # Bundle Analysis
  # ============================================
  bundle-analysis:
    name: Bundle Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.docs-only == 'false' && github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Analyze store bundle
        run: cd apps/store && ANALYZE=true pnpm run build || true

      - name: Upload bundle analysis
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: bundle-analysis
          path: apps/store/.next/analyze/
          retention-days: 7
