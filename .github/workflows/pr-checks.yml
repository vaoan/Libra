name: PR Checks

on:
  pull_request:
    # `edited` fires when the title, body or base branch changes. Without it the
    # PR Title check validated the title once, at open, and a corrected title
    # could never clear the failure -- the only way through was an unrelated
    # commit. Branch Target has the same problem when the base is retargeted.
    # The heavier jobs below opt out of `edited` so a typo fix does not re-run
    # an audit.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # ============================================
  # Branch Target Validation
  # ============================================
  branch-target:
    name: Branch Target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate branch can target base
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const baseBranch = context.payload.pull_request.base.ref;
            const headBranch = context.payload.pull_request.head.ref;

            console.log(`PR: ${headBranch} -> ${baseBranch}`);

            const isRelease = headBranch.startsWith('release/');
            const isFix = headBranch.startsWith('fix/');

            if (baseBranch === 'main') {
              if (!isRelease && !isFix) {
                core.setFailed(
                  `Branch '${headBranch}' cannot target 'main'.\n\n` +
                  `Only release/* and fix/* branches can merge to main.\n\n` +
                  `Please change the base branch to 'develop' or rename your branch.`
                );
                return;
              }
              console.log(`Release/fix branch targeting main - OK`);
            } else if (baseBranch === 'develop') {
              if (isRelease) {
                core.setFailed(
                  `Release branch '${headBranch}' should target 'main', not 'develop'.`
                );
                return;
              }
              console.log(`Targeting develop - OK`);
            } else {
              console.log(`Targeting ${baseBranch} - OK`);
            }

  # ============================================
  # PR Title Check (Conventional Commits)
  # ============================================
  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            revert
          requireScope: false
          subjectPattern: ^.{1,80}$
          subjectPatternError: |
            PR title must be less than 80 characters.
            Example: "feat(store): add product catalog"

  # ============================================
  # Changed Files Analysis
  # ============================================
  changes:
    name: Detect Changes
    # Not re-run when only the title or body changed.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      store: ${{ steps.changes.outputs.store }}
      admin: ${{ steps.changes.outputs.admin }}
      auth: ${{ steps.changes.outputs.auth }}
      packages: ${{ steps.changes.outputs.packages }}
      tests: ${{ steps.changes.outputs.tests }}
      e2e: ${{ steps.changes.outputs.e2e }}
      docs: ${{ steps.changes.outputs.docs }}
      deps: ${{ steps.changes.outputs.deps }}
      code: ${{ steps.changes.outputs.code }}
      docs-only: ${{ steps.check.outputs.docs-only }}
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Detect file changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        with:
          filters: |
            store:
              - 'apps/store/**'
            admin:
              - 'apps/admin/**'
            auth:
              - 'apps/auth/**'
            packages:
              - 'packages/**'
            tests:
              - 'apps/*/src/**/*.test.ts'
              - 'apps/*/src/**/*.test.tsx'
              - 'apps/*/vitest.config.ts'
            e2e:
              - 'apps/*/e2e/**'
              - 'apps/*/playwright.config.ts'
            docs:
              - '*.md'
              - 'docs/**'
              - '.claude/**'
              - '.ai-context/**'
            deps:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'apps/*/package.json'
              - 'packages/*/package.json'
            code:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              # Not app code, but changing either can break production without
              # touching apps/ at all — and docs-only skips the Security Audit
              # job, which is where secretlint, semgrep and the sync-secrets
              # workflow test run. A PR editing only .github/workflows/
              # sync-secrets.yml was classified docs-only and skipped all four.
              - 'scripts/**'
              - '.github/workflows/**'

      - name: Check if docs-only
        id: check
        run: |
          if [ "${{ steps.changes.outputs.code }}" = "false" ]; then
            echo "docs-only=true" >> $GITHUB_OUTPUT
          else
            echo "docs-only=false" >> $GITHUB_OUTPUT
          fi

  # ============================================
  # Security Audit (skip for docs-only PRs)
  # ============================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    # Not re-run when only the title or body changed.
    if: needs.changes.outputs.docs-only == 'false' && github.event.action != 'edited'
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: python -m pip install --upgrade pip semgrep

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --audit-level=high || echo "::warning::Security vulnerabilities found"

      - name: Run Semgrep
        run: pnpm semgrep

      - name: Run secretlint
        run: pnpm run secretlint

      # Guards .github/workflows/sync-secrets.yml, which produces the only
      # backup of secrets GitHub stores write-only. Both bugs it has had failed
      # silently — the sync reported success while omitting secrets — so it is
      # gated here rather than left to be noticed during a restore.
      #
      # Also runs the load-root-env.cjs / load-env.mjs equivalence test —
      # load-root-env.cjs can't delegate to load-env.mjs (breaks Playwright's
      # config loading), so it's a parallel implementation that needs this
      # test to catch drift between the two.
      #
      # This used to name five files explicitly, because vitest.config.scripts.js
      # also picks up load-env.test.js and that file was failing on a vite
      # dynamic import -- so the gate ran the subset that passed and said so.
      # The import is fixed (vi.resetModules, which needs no dynamic specifier),
      # and the whole config runs now: 12 files, 124 tests.
      - name: Run workflow config tests
        run: pnpm run test:workflows

  # ============================================
  # PR Summary Comment
  # ============================================
  summary:
    name: PR Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes]
    # always() so it still reports when an earlier job failed, but not for a
    # title or body edit -- that would only rewrite the same comment.
    if: always() && github.event.action != 'edited'
    steps:
      - name: Create or update PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const changes = {
              store: '${{ needs.changes.outputs.store }}' === 'true',
              admin: '${{ needs.changes.outputs.admin }}' === 'true',
              auth: '${{ needs.changes.outputs.auth }}' === 'true',
              packages: '${{ needs.changes.outputs.packages }}' === 'true',
              tests: '${{ needs.changes.outputs.tests }}' === 'true',
              e2e: '${{ needs.changes.outputs.e2e }}' === 'true',
              docs: '${{ needs.changes.outputs.docs }}' === 'true',
              deps: '${{ needs.changes.outputs.deps }}' === 'true'
            };

            let summary = '## PR Analysis\n\n';
            summary += '### Changed Areas\n';
            summary += `| Area | Changed |\n`;
            summary += `|------|:-------:|\n`;
            summary += `| Store app | ${changes.store ? 'YES' : '-'} |\n`;
            summary += `| Admin app | ${changes.admin ? 'YES' : '-'} |\n`;
            summary += `| Auth app | ${changes.auth ? 'YES' : '-'} |\n`;
            summary += `| Shared packages | ${changes.packages ? 'YES' : '-'} |\n`;
            summary += `| Unit tests | ${changes.tests ? 'YES' : '-'} |\n`;
            summary += `| E2E tests | ${changes.e2e ? 'YES' : '-'} |\n`;
            summary += `| Documentation | ${changes.docs ? 'YES' : '-'} |\n`;
            summary += `| Dependencies | ${changes.deps ? 'YES' : '-'} |\n`;

            if ((changes.store || changes.packages) && !changes.tests) {
              summary += '\n### TDD Reminder\n';
              summary += 'Source code changed but no unit tests were modified. ';
              summary += 'Please ensure new/modified code has test coverage.\n';
            }

            if (changes.deps) {
              summary += '\n### Dependency Changes\n';
              summary += 'Dependencies were modified. Security audit will run automatically.\n';
            }

            if (changes.packages) {
              summary += '\n### Shared Package Changes\n';
              summary += 'Shared packages were modified. All apps will be rebuilt.\n';
            }

            summary += '\n---\n';
            summary += '*This comment is automatically updated on each push.*';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## PR Analysis')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: summary
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary
              });
            }
